name: Build

# Every push to main builds the app and publishes it as the next release (v1.0.0, v1.0.1, ...).
# Pull requests only build. To start a new major/minor line, push a tag like v2.0.0 once;
# the following commits continue from it (v2.0.1, ...).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes must not both claim the same version number.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick version
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [[ -z "$last" ]]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Last release: ${last:-none}, next: v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build universal app and DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Andromax-dmg
          path: build/Andromax-*.dmg

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/Andromax-$VERSION.dmg" \
            --target "$GITHUB_SHA" --title "Andromax v$VERSION" --generate-notes
