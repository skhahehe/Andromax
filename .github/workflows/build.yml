name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app and DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Andromax-dmg
          path: build/Andromax-*.dmg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Andromax-*.dmg --title "Andromax $GITHUB_REF_NAME" --generate-notes
